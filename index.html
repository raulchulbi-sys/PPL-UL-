<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PPL-UL • Registro de entrenamiento</title>
<style>
:root{--bg:#0b0d10;--card:#15191e;--card2:#1b2026;--text:#f4f6f8;--muted:#9ba4ae;--line:#2a3139;--accent:#fff;--ok:#b9f6ca;--danger:#ff8e8e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.top-actions{display:flex;gap:8px}.btn,.seg button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:12px}
.btn.active,.seg button.active{background:var(--text);color:#111;border-color:var(--text)}
.seg{display:flex;gap:6px;background:#111419;border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:14px}.seg button{flex:1;border:0;background:transparent}
.days{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:16px}.days button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 12px;border-radius:12px}.days button.active{color:#111;background:#fff}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}.ex-head{display:flex;justify-content:space-between;gap:12px;padding:15px}.ex-name{font-weight:700}.target{font-size:12px;color:var(--muted);margin-top:4px}.rest{font-size:12px;color:var(--muted);white-space:nowrap}
.series{border-top:1px solid var(--line);padding:10px}.row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 42px;gap:7px;align-items:center;margin:6px 0}.row input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:#fff;padding:9px;outline:none}.row input:focus{border-color:#fff}.num{color:var(--muted);text-align:center;font-size:12px}.check{height:38px;width:38px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:transparent}.check.done{background:#eaffef;color:#111}.labels{display:grid;grid-template-columns:28px 1fr 1fr 1fr 42px;gap:7px;color:var(--muted);font-size:10px;padding:0 0 4px}.note{width:100%;margin-top:8px;background:transparent;border:0;border-top:1px solid var(--line);color:var(--text);padding:10px 0 2px;outline:none}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,16,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:center;gap:8px;z-index:5}.footerbar button{max-width:220px;flex:1}
.empty{color:var(--muted);padding:25px;text-align:center}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;display:none;z-index:10;font-size:13px}
.floating-timer{position:fixed;right:14px;bottom:72px;z-index:15;display:none;align-items:center;gap:10px;background:rgba(21,25,30,.96);border:1px solid #fff;border-radius:15px;padding:9px 10px 9px 13px;box-shadow:0 8px 30px rgba(0,0,0,.4);backdrop-filter:blur(10px);font-weight:800}
.floating-timer span{font-size:22px;letter-spacing:.5px}.floating-timer small{font-size:10px;color:var(--muted);font-weight:500}.timer-actions{display:flex;gap:5px}.timer-actions button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:#fff}.floating-timer.minimized{padding:7px 8px;border-radius:12px}.floating-timer.minimized small{display:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(700px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;max-height:80vh;overflow:auto}.history-item{padding:12px 0;border-bottom:1px solid var(--line)}
.history-check{accent-color:#fff;cursor:pointer}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}.wrap{padding-top:28px}}

.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-screen ~ .footerbar{display:none}

.auth-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.auth-card h1{margin-bottom:4px}.auth-card p{color:var(--muted);font-size:13px}
.auth-card input{width:100%;background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:11px;padding:12px;margin:6px 0;outline:none}
.auth-card input:focus{border-color:#fff}.auth-main{width:100%;margin-top:10px;background:#fff;color:#111;border:0;border-radius:11px;padding:12px;font-weight:700}
.auth-switch{margin-top:12px;width:100%;background:transparent;color:var(--muted);border:0;padding:8px}.auth-error{color:var(--danger)!important;min-height:20px}.auth-ok{color:var(--ok)!important}
.user-pill{font-size:11px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b9f6ca;margin-right:5px}
.previous{margin:0 10px 10px;padding:11px 13px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12px}
.previous b{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
.previous .result{font-weight:700}
.account-actions{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>🏋️ PPL-UL</h1>
    <p id="authSubtitle">Inicia sesión para sincronizar tus entrenamientos.</p>
    <input id="authEmail" type="email" autocomplete="email" placeholder="Correo electrónico">
    <input id="authPassword" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button class="auth-main" id="authMainBtn" onclick="submitAuth()">Iniciar sesión</button>
    <button class="auth-switch" id="authSwitchBtn" onclick="toggleAuthMode()">Crear cuenta</button>
    <p id="authMessage" class="auth-error"></p>
  </div>
</div>
<div class="wrap" id="appWrap" style="display:none">
<header>
<div><h1>🏋️ PPL-UL</h1><div class="sub"><span class="cloud-dot"></span>Sincronizado en la nube · <span class="user-pill" id="userEmail"></span></div></div>
<div class="top-actions account-actions"><button class="btn" onclick="openHistory()">Historial</button><button class="btn" onclick="logout()">Salir</button></div>
</header>
<div class="seg"><button id="vlcBtn" class="active" onclick="setRoutine('VLC')">VLC</button><button id="xtvBtn" onclick="setRoutine('XTV')">XTV</button></div>
<div class="days" id="days"></div>
<div class="summary" id="summary"></div>
<div id="workout"></div>
</div>
<div class="footerbar"><button class="btn" onclick="finishWorkout()">✅ Guardar sesión</button><button class="btn" onclick="openTimer()">⏱️ Descanso</button></div>
<div id="timerModal" class="modal" onclick="if(event.target===this)closeTimerModal()"><div class="sheet" style="text-align:center"><h2 style="margin-top:0">⏱️ Tiempo de descanso</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0"><button class="btn" onclick="startTimer(120)">2'</button><button class="btn" onclick="startTimer(180)">3'</button><button class="btn" onclick="startTimer(240)">4'</button><button class="btn" onclick="startTimer(300)">5'</button></div><button class="btn" onclick="closeTimerModal()">Cerrar</button></div></div>
<div id="floatingTimer" class="floating-timer"><div><span id="timerMini">3:00</span><small> descanso</small></div><div class="timer-actions"><button onclick="toggleTimerMinimize()" id="timerMinBtn">—</button><button onclick="stopTimer()">×</button></div></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeHistory()"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Historial</h2><button class="btn" onclick="closeHistory()">Cerrar</button></div><div id="history"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yvguatdqncadkwewlepe.supabase.co";
const SUPABASE_KEY = "sb_publishable_VYoUECN0MaGIOC2LtGi0iw_C0wqUY-W";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ROUTINE = {"VLC": {"Lunes / Push": [["Aperturas", "1x7-9 / 2x10-12", "2-3'"], ["Press MP 45º", "1x5-7 / 1x7-9", "4-5'"], ["Laterales mancuernas", "1x10-12 / 2x12-15", "2'"], ["Press convergente ascendente", "1x5-7 / 2x7-12", "3-4'"], ["Extensión de tríceps unilat.", "1x7-9 / 2x10-12", "2'"], ["Elevaciones polea unilat", "2x10-12", "2'"]], "Martes / Pull": [["Curl de bíceps 60º", "1x7-9 / 2x10-12", "2-3'"], ["Remo prono", "1x5-7 / 2x10-12", "3'"], ["Remo alto supino unilat.", "1x5-7 / 1x7-9", "2'"], ["Pull over unilat", "1x7-9 / 2x10-12", "2'"], ["Curl de bíceps en máquina Scott", "1x7-9 / 2x10-12", "2-3'"], ["Pájaros en máquina", "1xfallo", "-"]], "Miércoles / Leg": [["Aductor en máquina", "2xfallo", "2'"], ["Extensión de cuádriceps", "1x7-9 / 2x10-12", "2'"], ["Curl femoral", "1x7-9 / 2x10-12", "2'"], ["Hack squat", "1x5-7 / 1x7-9", "4'"], ["Gemelo", "1x7-9 / 2x10-12", "2'"], ["Sentadilla para cuádriceps máquina", "1x7-9 / 1x10-12 RIR1", "4'"], ["RDL", "2x7-9 RIR 2", "4'"]], "Viernes / Upper": [["Aperturas en máquina", "1x7-9 / 2x10-12", "2-3'"], ["Remo prono", "1x5-7 / 2x10-12", "3'"], ["Press convergente ascendente", "1x5-7 / 2x7-12", "3'"], ["Laterales mancuerna", "1x7-9 / 2x10-15", "2'"], ["Jalón al pecho prono", "1x7-9 / 2x10-12", "2-3'"], ["Laterales máquina", "1x7-9 / 1x10-15", "2'"]], "Sábado / Arms-Leg": [["Extensión de cuádriceps unilat.", "1x7-9 / 2x10-12", "2'"], ["Curl femoral sentado", "1x7-9 / 2x10-12", "2-3'"], ["Hack Pendular", "1x5-7 / 1x7-9", "4'"], ["Curl de bíceps máquina LF", "3x10-12", "2-3'"], ["Extensión de tríceps máquina", "2x10-12", "3'"], ["Extensión de tríceps polea", "1x10-15", "-"], ["Extensión de cuádriceps bilateral", "1x7-9 / 1x10-15+DS", "3'"]]}, "XTV": {"Lunes / Push": [["Aperturas", "1x7-9 / 2x10-12", "3-4'"], ["Press ascendente neutro", "1x5-7 / 1x7-9", "3'"], ["Laterales mancuernas", "1x10-12 / 2x12-15", "2'"], ["Press convergente ascendente", "1x5-7 / 2x7-12", "3'"], ["Extensión de tríceps unilat.", "1x7-9 / 2x10-12", "2'"], ["Elevaciones mancuerna", "2x10-12", "2'"]], "Martes / Pull": [["Curl de bíceps 60º", "1x7-9 / 2x10-12", "2-3'"], ["Remo prono", "1x5-7 / 2x10-12", "3'"], ["Remo polea unilat.", "1x7-9 / 1x10-12", "2'"], ["Pull over unilat", "1x7-9 / 2x10-12", "2'"], ["Curl de bíceps en máquina Scott", "1x7-9 / 2x10-12", "2-3'"], ["Pájaros en máquina", "1xfallo", "-"]], "Miércoles / Leg": [["Aductor en máquina", "2xfallo", "2'"], ["Extensión de cuádriceps", "1x7-9 / 2x10-12", "2'"], ["Curl femoral sentado", "1x7-9 / 2x10-12", "2'"], ["Hack Pendular", "1x5-7 / 1x7-9", "4'"], ["Gemelo", "1x7-9 / 2x10-12", "2'"], ["Prensa 45º", "1x7-9 / 1x10-12 RIR1", "4'"], ["RDL", "2x7-9 RIR 2", "4'"]], "Viernes / Upper": [["Aperturas en máquina", "1x7-9 / 2x10-12", "2-3'"], ["Remo prono", "1x5-7 / 2x10-12", "3'"], ["Press convergente ascendente", "1x5-7 / 2x7-12", "3'"], ["Laterales mancuerna", "1x7-9 / 2x10-15", "2'"], ["Jalón al pecho prono", "1x7-9 / 2x10-12", "2-3'"], ["Laterales máquina", "1x7-9 / 1x10-15", "2'"]], "Sábado / Arms-Leg": [["Extensión de cuádriceps unilat.", "1x7-9 / 2x10-12", "2'"], ["Curl femoral sentado", "1x7-9 / 2x10-12", "2-3'"], ["Hack Pendular", "1x5-7 / 1x7-9", "4'"], ["Curl de bíceps máquina LF", "3x10-12", "2-3'"], ["Extensión de tríceps máquina", "2x10-12", "3'"], ["Extensión de tríceps polea", "1x10-15", "-"], ["Extensión de cuádriceps bilateral", "1x7-9 / 1x10-15+DS", "3'"]]}};
let variant=localStorage.getItem('ppl_variant')||'VLC';
let day=localStorage.getItem('ppl_day')||Object.keys(ROUTINE[variant])[0];
let session=JSON.parse(localStorage.getItem('ppl_current')||'{}');
let timer=null, seconds=0;


let previousSession = {};
let authMode = 'login';
let currentUser = null;

function setAuthMessage(msg, ok=false){
 const el=document.getElementById('authMessage');
 el.textContent=msg||'';
 el.className=ok?'auth-ok':'auth-error';
}
function toggleAuthMode(){
 authMode=authMode==='login'?'signup':'login';
 document.getElementById('authMainBtn').textContent=authMode==='login'?'Iniciar sesión':'Crear cuenta';
 document.getElementById('authSwitchBtn').textContent=authMode==='login'?'Crear cuenta':'Ya tengo una cuenta';
 document.getElementById('authSubtitle').textContent=authMode==='login'?'Inicia sesión para sincronizar tus entrenamientos.':'Crea tu cuenta para guardar tus entrenamientos en la nube.';
 setAuthMessage('');
}
async function submitAuth(){
 const email=document.getElementById('authEmail').value.trim();
 const password=document.getElementById('authPassword').value;
 if(!email||!password){setAuthMessage('Introduce correo y contraseña.');return}
 if(password.length<6){setAuthMessage('La contraseña debe tener al menos 6 caracteres.');return}
 setAuthMessage('Conectando...', true);
 if(authMode==='login'){
   const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
   if(error){setAuthMessage(error.message);return}
   currentUser=data.user;
   await startApp();
 }else{
   const {data,error}=await supabaseClient.auth.signUp({email,password});
   if(error){setAuthMessage(error.message);return}
   if(data.session){
      currentUser=data.user;
      await startApp();
   }else{
      setAuthMessage('Cuenta creada. Revisa tu correo para confirmar la cuenta y después inicia sesión.', true);
      authMode='login';
      document.getElementById('authMainBtn').textContent='Iniciar sesión';
      document.getElementById('authSwitchBtn').textContent='Crear cuenta';
   }
 }
}
async function logout(){
 await supabaseClient.auth.signOut();
 currentUser=null;
 document.getElementById('appWrap').style.display='none';
 document.querySelector('.footerbar').style.display='none';
 document.getElementById('authScreen').style.display='flex';
 setAuthMessage('');
}
async function startApp(){
 document.getElementById('authScreen').style.display='none';
 document.querySelector('.footerbar').style.display='flex';
 document.getElementById('appWrap').style.display='block';
 document.getElementById('userEmail').textContent=currentUser.email||'Cuenta';
 await loadCloudHistory();
 render();
}
async function loadCloudHistory(){
 if(!currentUser)return;
 const {data,error}=await supabaseClient
   .from('workouts')
   .select('id,variant,day,workout_date,created_at,data')
   .eq('user_id',currentUser.id)
   .order('workout_date',{ascending:false})
   .order('created_at',{ascending:false});
 if(error){toast('No se pudo cargar el historial');console.error(error);return}
 localStorage.setItem('ppl_cloud_history',JSON.stringify(data||[]));
 await loadPreviousSession();
}
async function loadPreviousSession(){
 previousSession={};
 if(!currentUser)return;
 const {data,error}=await supabaseClient
   .from('workouts')
   .select('id,variant,day,workout_date,created_at,data')
   .eq('user_id',currentUser.id)
   .eq('variant',variant)
   .eq('day',day)
   .order('workout_date',{ascending:false})
   .order('created_at',{ascending:false})
   .limit(1);
 if(error){console.error(error);return}
 if(data&&data.length) previousSession=data[0].data?.exercises||{};
}
function previousHTML(name){
 const prev=previousSession[name];
 if(!prev || !prev.sets)return '';
 const completed=prev.sets.filter(s=>s.done);
 if(!completed.length)return '';
 const lines=completed.map(s=>`${s.weight||'?'} kg × ${s.reps||'?'}${s.rir!==''&&s.rir!=null?' · RIR '+s.rir:''}`).join(' &nbsp; / &nbsp; ');
 return `<div class="previous"><b>ÚLTIMA SESIÓN</b><div class="result">${lines}</div></div>`;
}

function key(){return variant+'|'+day}
function initDay(){
 if(!session[key()]) session[key()]=ROUTINE[variant][day].map(([name,target,rest])=>({name,target,rest,sets:parseTarget(target),note:''}));
}
function parseTarget(s){
 let out=[]; let parts=s.split('/').map(x=>x.trim());
 parts.forEach(p=>{let m=p.match(/(\d+)\s*x\s*([^ ]+)/i); if(m){for(let i=0;i<+m[1];i++)out.push({weight:'',reps:'',rir:'',done:false});}});
 return out.length?out:[{weight:'',reps:'',rir:'',done:false}];
}
function save(){localStorage.setItem('ppl_current',JSON.stringify(session));}
async function setRoutine(v){variant=v;localStorage.setItem('ppl_variant',v);day=Object.keys(ROUTINE[v])[0];localStorage.setItem('ppl_day',day);await loadPreviousSession();render()}
async function setDay(d){day=d;localStorage.setItem('ppl_day',d);await loadPreviousSession();render()}
async function setDayByIndex(i){day=Object.keys(ROUTINE[variant])[i];localStorage.setItem('ppl_day',day);await loadPreviousSession();render()}
function render(){
 initDay(); save();
 document.querySelectorAll('.seg button').forEach(b=>b.classList.remove('active'));document.getElementById(variant==='VLC'?'vlcBtn':'xtvBtn').classList.add('active');
 document.getElementById('days').innerHTML=Object.keys(ROUTINE[variant]).map((d,i)=>`<button class="${d===day?'active':''}" onclick="setDayByIndex(${i})">${d}</button>`).join('');
 const ex=session[key()];
 const done=ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0), total=ex.reduce((a,e)=>a+e.sets.length,0);
 document.getElementById('summary').innerHTML=`<div class="stat"><b>${ex.length}</b><span>ejercicios</span></div><div class="stat"><b>${total}</b><span>series previstas</span></div><div class="stat"><b>${done}/${total}</b><span>completadas</span></div>`;
 document.getElementById('workout').innerHTML=ex.map((e,i)=>exerciseHTML(e,i)).join('');
}
function exerciseHTML(e,ei){
 return `<section class="exercise"><div class="ex-head"><div><div class="ex-name">${e.name}</div><div class="target">Objetivo: ${e.target}</div></div><div class="rest">Descanso ${e.rest}</div></div>${previousHTML(e.name)}<div class="series"><div class="labels"><span>#</span><span>KG</span><span>REPS</span><span>RIR</span><span></span></div>${e.sets.map((s,si)=>`<div class="row"><span class="num">${si+1}</span><input inputmode="decimal" placeholder="kg" value="${s.weight}" oninput="update(${ei},${si},'weight',this.value)"><input inputmode="numeric" placeholder="reps" value="${s.reps}" oninput="update(${ei},${si},'reps',this.value)"><input inputmode="numeric" placeholder="RIR" value="${s.rir}" oninput="update(${ei},${si},'rir',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleDone(${ei},${si})">${s.done?'✓':''}</button></div>`).join('')}<input class="note" placeholder="Notas del ejercicio..." value="${e.note||''}" oninput="update(${ei},null,'note',this.value)"></div></section>`;
}
function update(ei,si,field,value){
 const exercise=session[key()][ei];
 if(si===null){
   exercise.note=value;
 }else{
   exercise.sets[si][field]=value;
 }
 save();
}
function toggleDone(ei,si){session[key()][ei].sets[si].done=!session[key()][ei].sets[si].done;save();render()}
async function finishWorkout(){
 const ex=session[key()]; const completed=ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
 if(!completed){toast('Marca al menos una serie como completada');return}
 if(!currentUser){toast('Inicia sesión para guardar');return}
 const payload={exercises:ex};
 const {error}=await supabaseClient.from('workouts').insert({
   user_id:currentUser.id,variant,day,workout_date:new Date().toISOString().slice(0,10),data:payload
 });
 if(error){console.error(error);toast('Error al guardar en la nube');return}
 // Limpiar kg/reps/RIR y marcas, pero conservar las notas para la próxima sesión.
 session[key()] = ex.map(e => ({
   name: e.name,
   target: e.target,
   rest: e.rest,
   note: e.note || '',
   sets: e.sets.map(() => ({weight:'', reps:'', rir:'', done:false}))
 }));
 save();
 await loadCloudHistory();
 toast('☁️ Sesión guardada · datos preparados para la próxima');
 render();
}
function openHistory(){
 const h=JSON.parse(localStorage.getItem('ppl_cloud_history')||'[]');
 document.getElementById('history').innerHTML = h.length ? `
   <div style="display:flex;gap:8px;align-items:center;margin:14px 0">
     <button class="btn" onclick="toggleAllHistory()">☑️ Seleccionar todo</button>
     <button class="btn" onclick="deleteSelectedHistory()">🗑️ Borrar seleccionadas</button>
   </div>
   <div id="historyList">
   ${h.map(x=>{
     const ex=x.data?.exercises||[];
     return `<div class="history-item" data-history-id="${x.id}">
       <div style="display:flex;gap:10px;align-items:flex-start">
         <input type="checkbox" class="history-check" data-id="${x.id}" style="width:18px;height:18px;margin-top:3px">
         <div style="flex:1">
           <b>${new Date(x.workout_date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</b>
           <div style="color:var(--muted);font-size:12px;margin-top:4px">${x.variant} · ${x.day}</div>
           <div style="margin-top:8px">${ex.map(e=>{
             let s=(e.sets||[]).filter(z=>z.done);
             return s.length?`<div>${e.name}: ${s.map(z=>`${z.weight||'?'}kg × ${z.reps||'?'}${z.rir!==''?' · RIR '+z.rir:''}`).join(' / ')}</div>`:'';
           }).filter(Boolean).join('')}</div>
         </div>
       </div>
     </div>`;
   }).join('')}
   </div>` : '<div class="empty">Todavía no hay sesiones guardadas.</div>';
 document.getElementById('modal').classList.add('show');
}
function toggleAllHistory(){
 const checks=[...document.querySelectorAll('.history-check')];
 const shouldCheck=checks.some(c=>!c.checked);
 checks.forEach(c=>c.checked=shouldCheck);
}
async function deleteSelectedHistory(){
 const ids=[...document.querySelectorAll('.history-check:checked')].map(c=>c.dataset.id);
 if(!ids.length){toast('Selecciona al menos una sesión');return}
 if(!confirm(`¿Seguro que quieres borrar ${ids.length} sesión${ids.length===1?'':'es'}? Esta acción no se puede deshacer.`))return;
 const {error}=await supabaseClient.from('workouts').delete().in('id',ids);
 if(error){console.error(error);toast('No se pudieron borrar las sesiones');return}
 await loadCloudHistory();
 toast(`🗑️ ${ids.length} sesión${ids.length===1?'':'es'} borrada${ids.length===1?'':'s'}`);
 openHistory();
}
function closeHistory(){document.getElementById('modal').classList.remove('show')}
function openTimer(){document.getElementById('timerModal').classList.add('show')}
function closeTimerModal(){document.getElementById('timerModal').classList.remove('show')}
function startTimer(duration){
 clearInterval(timer); seconds=duration; closeTimerModal();
 const box=document.getElementById('floatingTimer'); box.style.display='flex'; box.classList.remove('minimized');
 document.getElementById('timerMinBtn').textContent='—'; updateTimerDisplay();
 timer=setInterval(()=>{seconds--;updateTimerDisplay();if(seconds<=0){clearInterval(timer);seconds=0;updateTimerDisplay();toast('⏰ Descanso terminado');}},1000)
}
function updateTimerDisplay(){
 const m=Math.floor(seconds/60),s=String(seconds%60).padStart(2,'0'),txt=m+':'+s;
 const mini=document.getElementById('timerMini');if(mini)mini.textContent=txt;
}
function toggleTimerMinimize(){
 const box=document.getElementById('floatingTimer');box.classList.toggle('minimized');
 document.getElementById('timerMinBtn').textContent=box.classList.contains('minimized')?'+':'—';
}
function stopTimer(){clearInterval(timer);seconds=0;document.getElementById('floatingTimer').style.display='none'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
document.querySelector('.footerbar').style.display='none';
supabaseClient.auth.getSession().then(async ({data})=>{
 if(data.session){currentUser=data.session.user;await startApp();}
 else {document.getElementById('authScreen').style.display='flex';document.getElementById('appWrap').style.display='none';}
});
supabaseClient.auth.onAuthStateChange(async (_event, session)=>{
 if(session && !currentUser){currentUser=session.user;await startApp();}
});
</script>
</body>
